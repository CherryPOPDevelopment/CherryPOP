<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Cherry.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body class="dash-body">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ── SIDEBAR ──────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <a href="/" class="logo sidebar-logo">cherry<span>.dev</span></a>
    <nav class="sidebar-nav" aria-label="Dashboard navigation">
      <button type="button" class="sidebar-link active" data-tab="inquiries" aria-pressed="true" aria-controls="tab-inquiries">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Inquiries
        <span class="badge" id="newBadge"></span>
      </button>
      <button type="button" class="sidebar-link" data-tab="editor" aria-pressed="false" aria-controls="tab-editor">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit Site
      </button>
      <a href="/" class="sidebar-link">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        View Site
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-chip" id="userChip">
        <span class="user-avatar" id="userAvatar" aria-hidden="true">A</span>
        <span class="user-name" id="userName">Admin</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <!-- ── MAIN ─────────────────────────────────────────────────────────────── -->
  <main class="dash-main" id="main-content" tabindex="-1">

    <!-- ════ INQUIRIES TAB ════ -->
    <div id="tab-inquiries" class="dash-tab" aria-hidden="false">
      <header class="dash-header">
        <div>
          <h1 class="dash-title">Inquiries</h1>
          <p class="dash-sub">Manage all incoming project requests</p>
        </div>
        <div class="dash-header-actions">
          <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
        </div>
      </header>

      <div class="dash-stats" id="dashStats">
        <div class="dash-stat-card">
          <span class="dash-stat-num" id="statTotal">—</span>
          <span class="dash-stat-label">Total</span>
        </div>
        <div class="dash-stat-card">
          <span class="dash-stat-num" id="statNew">—</span>
          <span class="dash-stat-label">New</span>
        </div>
        <div class="dash-stat-card">
          <span class="dash-stat-num" id="statAccepted">—</span>
          <span class="dash-stat-label">Accepted</span>
        </div>
        <div class="dash-stat-card">
          <span class="dash-stat-num" id="statCompleted">—</span>
          <span class="dash-stat-label">Completed</span>
        </div>
      </div>

      <div class="dash-filters" role="group" aria-label="Filter inquiries by status">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-filter="new" aria-pressed="false">New</button>
        <button class="filter-btn" data-filter="in_review" aria-pressed="false">In Review</button>
        <button class="filter-btn" data-filter="accepted" aria-pressed="false">Accepted</button>
        <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
        <button class="filter-btn" data-filter="declined" aria-pressed="false">Declined</button>
      </div>

      <div class="dash-table-wrapper">
        <table class="dash-table" id="inquiriesTable">
          <caption class="visually-hidden">Project inquiries</caption>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Service</th>
              <th scope="col">Budget</th>
              <th scope="col">Status</th>
              <th scope="col">Date</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="inquiriesBody">
            <tr>
              <td colspan="8" class="table-empty">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ════ EDITOR TAB ════ -->
    <div id="tab-editor" class="dash-tab dash-tab--hidden" aria-hidden="true">
      <header class="dash-header">
        <div>
          <h1 class="dash-title">Edit Site</h1>
          <p class="dash-sub">Update text for every section of your website</p>
        </div>
        <div class="dash-header-actions" id="editorSaveStatus"></div>
      </header>

      <!-- Section tabs -->
      <div class="editor-section-tabs" role="group" aria-label="Edit website section">
        <button class="esec-btn active" data-sec="hero" aria-pressed="true">Hero</button>
        <button class="esec-btn" data-sec="services" aria-pressed="false">Services</button>
        <button class="esec-btn" data-sec="about" aria-pressed="false">About</button>
        <button class="esec-btn" data-sec="contact" aria-pressed="false">Contact</button>
      </div>

      <div class="editor-body" id="editorBody">
        <p class="editor-loading">Loading content…</p>
      </div>
    </div>

  </main>

  <!-- ── DETAIL MODAL ──────────────────────────────────────────────────────── -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Inquiry details" aria-hidden="true" inert>
    <div class="modal" id="modal" tabindex="-1">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close inquiry details">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const VALID_STATUSES = [
      'new',
      'in_review',
      'accepted',
      'completed',
      'declined',
    ];
    const DEFAULT_CONTENT = {
      hero: {
        badge: '✦ Available for projects',
        title: 'I build digital experiences that convert & scale',
        subtitle: 'Freelance developer specialising in websites, mobile apps, and full-featured online shops. Clean code. On time. No fluff.',
        cta_primary: 'Start a Project',
        cta_secondary: 'View My Work',
        stat1_num: '40+',
        stat1_label: 'Projects Delivered',
        stat2_num: '98%',
        stat2_label: 'Client Satisfaction',
        stat3_num: '5yr',
        stat3_label: 'Experience',
      },
      services: {
        tag: 'What I do',
        title: 'Services',
        subtitle: 'End-to-end solutions built around your goals.',
        website_title: 'Website Development',
        website_desc: 'Blazing-fast, responsive websites engineered for performance and SEO. From landing pages to complex portals.',
        app_title: 'App Development',
        app_desc: 'Cross-platform mobile & web applications that feel native on every device. Built with modern frameworks.',
        shop_title: 'Shop Development',
        shop_desc: 'High-converting e-commerce stores with seamless checkout, inventory management, and payment integration.',
      },
      about: {
        tag: 'About me',
        title: 'Turning ideas into working products',
        body1: "I'm a full-stack freelance developer with nearly 2 years of experienceon building websites, mobile apps, and online shops. I specialise in no-code development and design with a special interest in python, java, mysql, and css code. I am very passionate and excited to continue to learn and grow my skills and knowledge-- and to work with you!",
        body2: '',
        cta: 'Work with me',
      },
      contact: {
        tag: "Let's talk",
        title: 'Start a Project',
        subtitle: "Fill in the form and I'll get back to you within 24 hours.",
        info1: '📍 Remote — worldwide',
        info2: '⏱ Response within 24h',
        info3: '📅 Currently accepting new clients',
      },
    };
    let allInquiries = [];
    let currentFilter = 'all';

    // ════ AUTH GUARD ════════════════════════════════════════════════════════
    (async () => {
      try {
        const res = await fetch('/api/auth/check', { credentials: 'include' });
        const data = await res.json();
        if (!data.loggedIn) {
          window.location.href = '/login';
          return;
        }
        document.getElementById('userName').textContent = data.user.username;
        document.getElementById('userAvatar').textContent = data.user.username[0].toUpperCase();
      } catch (_) {
        window.location.href = '/login';
      }
    })();

    // ════ TAB SWITCHING ══════════════════════════════════════════════════════
    document.querySelectorAll('.sidebar-link[data-tab]').forEach(link => {
      link.addEventListener('click', () => {
        const tab = link.dataset.tab;
        document.querySelectorAll('.sidebar-link[data-tab]').forEach(item => {
          item.classList.remove('active');
          item.setAttribute('aria-pressed', 'false');
        });
        link.classList.add('active');
        link.setAttribute('aria-pressed', 'true');
        document.querySelectorAll('.dash-tab').forEach(item => {
          item.classList.add('dash-tab--hidden');
          item.setAttribute('aria-hidden', 'true');
        });
        const selectedTab = document.getElementById('tab-' + tab);
        selectedTab.classList.remove('dash-tab--hidden');
        selectedTab.setAttribute('aria-hidden', 'false');
        if (tab === 'editor') {
          loadEditorSection(currentEditorSection);
        }
      });
    });

    // ════ INQUIRIES ══════════════════════════════════════════════════════════
    async function loadInquiries() {
      try {
        const res = await fetch('/api/inquiries', { credentials: 'include' });
        if (res.status === 403) {
          window.location.href = '/login';
          return;
        }
        allInquiries = await res.json();
        updateStats();
        renderTable();
      } catch (_) {
        document.getElementById('inquiriesBody').innerHTML =
          '<tr><td colspan="8" class="table-empty table-error">Failed to load inquiries.</td></tr>';
      }
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allInquiries.length;
      document.getElementById('statNew').textContent = allInquiries.filter(
        inquiry => inquiry.status === 'new',
      ).length;
      document.getElementById('statAccepted').textContent = allInquiries.filter(
        inquiry => inquiry.status === 'accepted',
      ).length;
      document.getElementById('statCompleted').textContent = allInquiries.filter(
        inquiry => inquiry.status === 'completed',
      ).length;
      const newCount = allInquiries.filter(
        inquiry => inquiry.status === 'new',
      ).length;
      const badge = document.getElementById('newBadge');
      badge.textContent = newCount || '';
      badge.style.display = newCount ? 'inline-flex' : 'none';
    }

    function renderTable() {
      const filtered = currentFilter === 'all'
        ? allInquiries
        : allInquiries.filter(inquiry => inquiry.status === currentFilter);
      const tbody = document.getElementById('inquiriesBody');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="table-empty">No inquiries found.</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(inquiry => `
        <tr data-id="${inquiry.id}">
          <td class="td-id">${inquiry.id}</td>
          <td class="td-name">${esc(inquiry.name)}</td>
          <td class="td-email"><a href="mailto:${esc(inquiry.email)}">${esc(inquiry.email)}</a></td>
          <td><span class="tag tag--${inquiry.service_type}">${inquiry.service_type}</span></td>
          <td>${inquiry.budget ? esc(inquiry.budget) : '<span class="muted">—</span>'}</td>
          <td>
            <select class="status-select status--${inquiry.status}" data-id="${inquiry.id}" aria-label="Change status for ${esc(inquiry.name)}">
              ${VALID_STATUSES.map(status => `<option value="${status}" ${status === inquiry.status ? 'selected' : ''}>${fmt(status)}</option>`).join('')}
            </select>
          </td>
          <td class="td-date">${fmtDate(inquiry.created_at)}</td>
          <td><button class="btn btn-ghost btn-sm view-btn" data-id="${inquiry.id}" aria-label="View inquiry from ${esc(inquiry.name)}">View</button></td>
        </tr>
      `).join('');
      tbody.querySelectorAll('.status-select').forEach(select => {
        select.addEventListener('change', () => {
          updateStatus(select.dataset.id, select.value);
        });
      });
      tbody.querySelectorAll('.view-btn').forEach(button => {
        button.addEventListener('click', () => {
          openModal(parseInt(button.dataset.id));
        });
      });
    }

    async function updateStatus(id, status) {
      try {
        await fetch(`/api/inquiries/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ status }),
        });
        const inquiryIndex = allInquiries.findIndex(inquiry => inquiry.id == id);
        if (inquiryIndex !== -1) {
          allInquiries[inquiryIndex].status = status;
        }
        updateStats();
        renderTable();
      } catch (_) {
        alert('Failed to update status.');
      }
    }

    let lastModalTrigger = null;
    const modalOverlay = document.getElementById('modalOverlay');

    function closeModal() {
      modalOverlay.classList.remove('open');
      modalOverlay.setAttribute('aria-hidden', 'true');
      modalOverlay.inert = true;
      if (lastModalTrigger && lastModalTrigger.isConnected) lastModalTrigger.focus();
    }

    function openModal(id) {
      const inquiry = allInquiries.find(item => item.id === id);
      if (!inquiry) return;
      lastModalTrigger = document.activeElement;
      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h2 id="modalTitle">${esc(inquiry.name)}</h2>
          <span class="tag tag--${inquiry.service_type}">${inquiry.service_type}</span>
        </div>
        <div class="modal-body">
          <div class="modal-field">
            <span class="modal-field-label">Email</span>
            <a href="mailto:${esc(inquiry.email)}">${esc(inquiry.email)}</a>
          </div>
          <div class="modal-field">
            <span class="modal-field-label">Budget</span>
            <span>${inquiry.budget ? esc(inquiry.budget) : '—'}</span>
          </div>
          <div class="modal-field">
            <span class="modal-field-label">Status</span>
            <span class="status-pill status--${inquiry.status}">${fmt(inquiry.status)}</span>
          </div>
          <div class="modal-field">
            <span class="modal-field-label">Submitted</span>
            <span>${fmtDate(inquiry.created_at)}</span>
          </div>
          <div class="modal-field full">
            <span class="modal-field-label">Message</span>
            <p class="modal-message">${esc(inquiry.message)}</p>
          </div>
        </div>`;
      modalOverlay.inert = false;
      modalOverlay.setAttribute('aria-hidden', 'false');
      modalOverlay.setAttribute('aria-labelledby', 'modalTitle');
      modalOverlay.classList.add('open');
      document.getElementById('modalClose').focus();
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', event => {
      if (event.target === modalOverlay) closeModal();
    });
    modalOverlay.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeModal();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = Array.from(modalOverlay.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), a[href]'))
        .filter(element => element.getClientRects().length > 0);
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    document.querySelectorAll('.filter-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(filterButton => {
          filterButton.classList.remove('active');
          filterButton.setAttribute('aria-pressed', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-pressed', 'true');
        currentFilter = button.dataset.filter;
        renderTable();
      });
    });
    document.getElementById('refreshBtn').addEventListener('click', loadInquiries);

    // ════ SITE EDITOR ════════════════════════════════════════════════════════
    let currentEditorSection = 'hero';

    const SECTION_FIELDS = {
      hero: [
        { key: 'badge', label: 'Availability Badge', type: 'text' },
        { key: 'title', label: 'Main Headline', type: 'textarea' },
        { key: 'subtitle', label: 'Subtitle / Tagline', type: 'textarea' },
        { key: 'cta_primary', label: 'Primary CTA Button', type: 'text' },
        { key: 'cta_secondary', label: 'Secondary CTA Button', type: 'text' },
        { key: 'stat1_num', label: 'Stat 1 — Number', type: 'text' },
        { key: 'stat1_label', label: 'Stat 1 — Label', type: 'text' },
        { key: 'stat2_num', label: 'Stat 2 — Number', type: 'text' },
        { key: 'stat2_label', label: 'Stat 2 — Label', type: 'text' },
        { key: 'stat3_num', label: 'Stat 3 — Number', type: 'text' },
        { key: 'stat3_label', label: 'Stat 3 — Label', type: 'text' },
      ],
      services: [
        { key: 'tag', label: 'Section Tag', type: 'text' },
        { key: 'title', label: 'Section Title', type: 'text' },
        { key: 'subtitle', label: 'Section Subtitle', type: 'text' },
        { key: 'website_title', label: 'Website Card — Title', type: 'text' },
        { key: 'website_desc', label: 'Website Card — Desc', type: 'textarea' },
        { key: 'app_title', label: 'App Card — Title', type: 'text' },
        { key: 'app_desc', label: 'App Card — Desc', type: 'textarea' },
        { key: 'shop_title', label: 'Shop Card — Title', type: 'text' },
        { key: 'shop_desc', label: 'Shop Card — Desc', type: 'textarea' },
      ],
      about: [
        { key: 'tag', label: 'Section Tag', type: 'text' },
        { key: 'title', label: 'Headline', type: 'textarea' },
        { key: 'body1', label: 'Paragraph 1', type: 'textarea' },
        { key: 'body2', label: 'Paragraph 2', type: 'textarea' },
        { key: 'cta', label: 'CTA Button Text', type: 'text' },
      ],
      contact: [
        { key: 'tag', label: 'Section Tag', type: 'text' },
        { key: 'title', label: 'Section Title', type: 'text' },
        { key: 'subtitle', label: 'Subtitle', type: 'textarea' },
        { key: 'info1', label: 'Info Line 1', type: 'text' },
        { key: 'info2', label: 'Info Line 2', type: 'text' },
        { key: 'info3', label: 'Info Line 3', type: 'text' },
      ],
    };

    document.querySelectorAll('.esec-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.esec-btn').forEach(sectionButton => {
          sectionButton.classList.remove('active');
          sectionButton.setAttribute('aria-pressed', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-pressed', 'true');
        currentEditorSection = button.dataset.sec;
        loadEditorSection(currentEditorSection);
      });
    });

    async function loadEditorSection(section) {
      const body = document.getElementById('editorBody');
      body.innerHTML = '<p class="editor-loading">Loading…</p>';
      try {
        const res = await fetch(`/api/content/${section}`, { credentials: 'include' });
        if (!res.ok) {
          throw new Error(`Content could not be loaded (${res.status}).`);
        }
        const data = await res.json();
        renderEditorForm(section, { ...DEFAULT_CONTENT[section], ...data });
      } catch (error) {
        renderEditorForm(section, DEFAULT_CONTENT[section], error.message);
      }
    }

    function renderEditorForm(section, data, loadError = '') {
      const fields = SECTION_FIELDS[section] || [];
      const body = document.getElementById('editorBody');
      body.innerHTML = `
        <form class="editor-form" id="editorForm">
          <div class="editor-fields">
            ${fields.map(field => `
              <div class="editor-field ${field.type === 'textarea' ? 'editor-field--wide' : ''}">
                <label for="editor-${field.key}">${esc(field.label)}</label>
                ${field.type === 'textarea'
                  ? `<textarea id="editor-${field.key}" name="${field.key}" rows="3">${esc(data[field.key] || '')}</textarea>`
                  : `<input id="editor-${field.key}" type="text" name="${field.key}" value="${esc(data[field.key] || '')}" />`
                }
              </div>
            `).join('')}
          </div>
          <div class="editor-footer">
            <div class="editor-alert ${loadError ? 'editor-alert--error' : ''}" id="editorAlert">${esc(loadError ? `Saved content could not be loaded. Showing website defaults. ${loadError}` : '')}</div>
            <button type="submit" class="btn btn-primary" id="editorSaveBtn" ${loadError ? 'disabled' : ''}>Save Changes</button>
          </div>
        </form>`;

      document.getElementById('editorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = document.getElementById('editorSaveBtn');
        const alert = document.getElementById('editorAlert');
        button.disabled = true;
        button.textContent = 'Saving…';
        alert.className = 'editor-alert';
        alert.textContent = '';

        const payload = {};
        fields.forEach(field => {
          payload[field.key] = e.target[field.key].value;
        });

        try {
          const res = await fetch(`/api/content/${section}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const result = await res.json();
          if (!res.ok || !result.success) {
            throw new Error(result.error || `Save failed (${res.status}).`);
          }
          const savedResponse = await fetch(`/api/content/${section}`, {
            credentials: 'include',
          });
          if (!savedResponse.ok) {
            throw new Error(`Changes could not be verified (${savedResponse.status}).`);
          }
          const savedContent = await savedResponse.json();
          const unsavedField = fields.find(field => savedContent[field.key] !== payload[field.key]);
          if (unsavedField) {
            throw new Error(`The saved ${unsavedField.label.toLowerCase()} could not be verified.`);
          }
          alert.className = 'editor-alert editor-alert--success';
          alert.textContent = '✓ Saved! Changes are live on your site.';
        } catch (error) {
          alert.className = 'editor-alert editor-alert--error';
          alert.textContent = '✗ ' + error.message;
        } finally {
          button.disabled = false;
          button.textContent = 'Save Changes';
        }
      });
    }

    // ════ SHARED ═════════════════════════════════════════════════════════════
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    });

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmt(status) {
      return status
        .replace(/_/g, ' ')
        .replace(/\b\w/g, character => character.toUpperCase());
    }
    function fmtDate(d) {
      return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    loadInquiries();
  </script>
</body>
</html>
