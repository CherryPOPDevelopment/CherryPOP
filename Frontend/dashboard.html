<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Cherry.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body class="dash-body">

  <!-- ── SIDEBAR ──────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <a href="/" class="logo sidebar-logo">cherry<span>.dev</span></a>
    <nav class="sidebar-nav">
      <a href="#" class="sidebar-link active" data-tab="inquiries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Inquiries
        <span class="badge" id="newBadge"></span>
      </a>
      <a href="#" class="sidebar-link" data-tab="editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit Site
      </a>
      <a href="/" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        View Site
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-chip" id="userChip">
        <span class="user-avatar" id="userAvatar">A</span>
        <span class="user-name" id="userName">Admin</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <!-- ── MAIN ─────────────────────────────────────────────────────────────── -->
  <main class="dash-main">

    <!-- ════ INQUIRIES TAB ════ -->
    <div id="tab-inquiries" class="dash-tab">
    <header class="dash-header">
      <div>
        <h1 class="dash-title">Inquiries</h1>
        <p class="dash-sub">Manage all incoming project requests</p>
      </div>
      <div class="dash-header-actions">
        <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
      </div>
    </header>

    <!-- Stats row -->
    <div class="dash-stats" id="dashStats">
      <div class="dash-stat-card"><span class="dash-stat-num" id="statTotal">—</span><span class="dash-stat-label">Total</span></div>
      <div class="dash-stat-card"><span class="dash-stat-num" id="statNew">—</span><span class="dash-stat-label">New</span></div>
      <div class="dash-stat-card"><span class="dash-stat-num" id="statAccepted">—</span><span class="dash-stat-label">Accepted</span></div>
      <div class="dash-stat-card"><span class="dash-stat-num" id="statCompleted">—</span><span class="dash-stat-label">Completed</span></div>
    </div>

    <!-- Filters -->
    <div class="dash-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="new">New</button>
      <button class="filter-btn" data-filter="in_review">In Review</button>
      <button class="filter-btn" data-filter="accepted">Accepted</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="filter-btn" data-filter="declined">Declined</button>
    </div>

    <!-- Table -->
    <div class="dash-table-wrapper">
      <table class="dash-table" id="inquiriesTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Service</th>
            <th>Budget</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inquiriesBody">
          <tr><td colspan="8" class="table-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    </div><!-- /tab-inquiries -->

    <!-- ════ EDITOR TAB ════ -->
    <div id="tab-editor" class="dash-tab" style="display:none">
      <header class="dash-header">
        <div>
          <h1 class="dash-title">Edit Site</h1>
          <p class="dash-sub">Update text for every section of your website</p>
        </div>
        <div class="dash-header-actions" id="editorSaveStatus"></div>
      </header>

      <!-- Section tabs -->
      <div class="editor-section-tabs">
        <button class="esec-btn active" data-sec="hero">Hero</button>
        <button class="esec-btn" data-sec="services">Services</button>
        <button class="esec-btn" data-sec="about">About</button>
        <button class="esec-btn" data-sec="contact">Contact</button>
      </div>

      <div class="editor-body" id="editorBody">
        <p class="editor-loading">Loading content…</p>
      </div>
    </div><!-- /tab-editor -->

  </main>

  <!-- ── DETAIL MODAL ──────────────────────────────────────────────────────── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const VALID_STATUSES = ['new', 'in_review', 'accepted', 'completed', 'declined'];
    let allInquiries = [];
    let currentFilter = 'all';

    // ════ AUTH GUARD ════════════════════════════════════════════════════════
    (async () => {
      try {
        const res  = await fetch('/api/auth/check', { credentials: 'include' });
        const data = await res.json();
        if (!data.loggedIn) { window.location.href = '/login'; return; }
        document.getElementById('userName').textContent   = data.user.username;
        document.getElementById('userAvatar').textContent = data.user.username[0].toUpperCase();
      } catch (_) { window.location.href = '/login'; }
    })();

    // ════ TAB SWITCHING ══════════════════════════════════════════════════════
    document.querySelectorAll('.sidebar-link[data-tab]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const tab = link.dataset.tab;
        document.querySelectorAll('.sidebar-link[data-tab]').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        document.querySelectorAll('.dash-tab').forEach(t => t.style.display = 'none');
        document.getElementById('tab-' + tab).style.display = '';
        if (tab === 'editor') loadEditorSection(currentEditorSection);
      });
    });

    // ════ INQUIRIES ══════════════════════════════════════════════════════════
    async function loadInquiries() {
      try {
        const res  = await fetch('/api/inquiries', { credentials: 'include' });
        if (res.status === 403) { window.location.href = '/login'; return; }
        allInquiries = await res.json();
        updateStats();
        renderTable();
      } catch (_) {
        document.getElementById('inquiriesBody').innerHTML =
          '<tr><td colspan="8" class="table-empty table-error">Failed to load inquiries.</td></tr>';
      }
    }

    function updateStats() {
      document.getElementById('statTotal').textContent     = allInquiries.length;
      document.getElementById('statNew').textContent       = allInquiries.filter(i => i.status === 'new').length;
      document.getElementById('statAccepted').textContent  = allInquiries.filter(i => i.status === 'accepted').length;
      document.getElementById('statCompleted').textContent = allInquiries.filter(i => i.status === 'completed').length;
      const newCount = allInquiries.filter(i => i.status === 'new').length;
      const badge = document.getElementById('newBadge');
      badge.textContent = newCount || '';
      badge.style.display = newCount ? 'inline-flex' : 'none';
    }

    function renderTable() {
      const filtered = currentFilter === 'all'
        ? allInquiries
        : allInquiries.filter(i => i.status === currentFilter);
      const tbody = document.getElementById('inquiriesBody');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="table-empty">No inquiries found.</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(i => `
        <tr data-id="${i.id}">
          <td class="td-id">${i.id}</td>
          <td class="td-name">${esc(i.name)}</td>
          <td class="td-email"><a href="mailto:${esc(i.email)}">${esc(i.email)}</a></td>
          <td><span class="tag tag--${i.service_type}">${i.service_type}</span></td>
          <td>${i.budget ? esc(i.budget) : '<span class="muted">—</span>'}</td>
          <td>
            <select class="status-select status--${i.status}" data-id="${i.id}" title="Change status">
              ${VALID_STATUSES.map(s => `<option value="${s}" ${s === i.status ? 'selected' : ''}>${fmt(s)}</option>`).join('')}
            </select>
          </td>
          <td class="td-date">${fmtDate(i.created_at)}</td>
          <td><button class="btn btn-ghost btn-sm view-btn" data-id="${i.id}">View</button></td>
        </tr>
      `).join('');
      tbody.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', () => updateStatus(sel.dataset.id, sel.value));
      });
      tbody.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => openModal(parseInt(btn.dataset.id)));
      });
    }

    async function updateStatus(id, status) {
      try {
        await fetch(`/api/inquiries/${id}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          credentials: 'include', body: JSON.stringify({ status }),
        });
        const idx = allInquiries.findIndex(i => i.id == id);
        if (idx !== -1) allInquiries[idx].status = status;
        updateStats(); renderTable();
      } catch (_) { alert('Failed to update status.'); }
    }

    function openModal(id) {
      const i = allInquiries.find(x => x.id === id);
      if (!i) return;
      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h2>${esc(i.name)}</h2>
          <span class="tag tag--${i.service_type}">${i.service_type}</span>
        </div>
        <div class="modal-body">
          <div class="modal-field"><label>Email</label><a href="mailto:${esc(i.email)}">${esc(i.email)}</a></div>
          <div class="modal-field"><label>Budget</label><span>${i.budget ? esc(i.budget) : '—'}</span></div>
          <div class="modal-field"><label>Status</label><span class="status-pill status--${i.status}">${fmt(i.status)}</span></div>
          <div class="modal-field"><label>Submitted</label><span>${fmtDate(i.created_at)}</span></div>
          <div class="modal-field full"><label>Message</label><p class="modal-message">${esc(i.message)}</p></div>
        </div>`;
      document.getElementById('modalOverlay').classList.add('open');
    }

    document.getElementById('modalClose').addEventListener('click', () =>
      document.getElementById('modalOverlay').classList.remove('open'));
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay'))
        document.getElementById('modalOverlay').classList.remove('open');
    });
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTable();
      });
    });
    document.getElementById('refreshBtn').addEventListener('click', loadInquiries);

    // ════ SITE EDITOR ════════════════════════════════════════════════════════
    let currentEditorSection = 'hero';

    // Field definitions for each section
    const SECTION_FIELDS = {
      hero: [
        { key: 'badge',          label: 'Availability Badge',    type: 'text' },
        { key: 'title',          label: 'Main Headline',         type: 'textarea' },
        { key: 'subtitle',       label: 'Subtitle / Tagline',    type: 'textarea' },
        { key: 'cta_primary',    label: 'Primary CTA Button',    type: 'text' },
        { key: 'cta_secondary',  label: 'Secondary CTA Button',  type: 'text' },
        { key: 'stat1_num',      label: 'Stat 1 — Number',       type: 'text' },
        { key: 'stat1_label',    label: 'Stat 1 — Label',        type: 'text' },
        { key: 'stat2_num',      label: 'Stat 2 — Number',       type: 'text' },
        { key: 'stat2_label',    label: 'Stat 2 — Label',        type: 'text' },
        { key: 'stat3_num',      label: 'Stat 3 — Number',       type: 'text' },
        { key: 'stat3_label',    label: 'Stat 3 — Label',        type: 'text' },
      ],
      services: [
        { key: 'tag',            label: 'Section Tag',           type: 'text' },
        { key: 'title',          label: 'Section Title',         type: 'text' },
        { key: 'subtitle',       label: 'Section Subtitle',      type: 'text' },
        { key: 'website_title',  label: 'Website Card — Title',  type: 'text' },
        { key: 'website_desc',   label: 'Website Card — Desc',   type: 'textarea' },
        { key: 'app_title',      label: 'App Card — Title',      type: 'text' },
        { key: 'app_desc',       label: 'App Card — Desc',       type: 'textarea' },
        { key: 'shop_title',     label: 'Shop Card — Title',     type: 'text' },
        { key: 'shop_desc',      label: 'Shop Card — Desc',      type: 'textarea' },
      ],
      about: [
        { key: 'tag',    label: 'Section Tag',    type: 'text' },
        { key: 'title',  label: 'Headline',       type: 'textarea' },
        { key: 'body1',  label: 'Paragraph 1',    type: 'textarea' },
        { key: 'body2',  label: 'Paragraph 2',    type: 'textarea' },
        { key: 'cta',    label: 'CTA Button Text',type: 'text' },
      ],
      contact: [
        { key: 'tag',      label: 'Section Tag',    type: 'text' },
        { key: 'title',    label: 'Section Title',  type: 'text' },
        { key: 'subtitle', label: 'Subtitle',       type: 'textarea' },
        { key: 'info1',    label: 'Info Line 1',    type: 'text' },
        { key: 'info2',    label: 'Info Line 2',    type: 'text' },
        { key: 'info3',    label: 'Info Line 3',    type: 'text' },
      ],
    };

    document.querySelectorAll('.esec-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.esec-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentEditorSection = btn.dataset.sec;
        loadEditorSection(currentEditorSection);
      });
    });

    async function loadEditorSection(section) {
      const body = document.getElementById('editorBody');
      body.innerHTML = '<p class="editor-loading">Loading…</p>';
      try {
        const res  = await fetch(`/api/content/${section}`, { credentials: 'include' });
        const data = await res.json();
        renderEditorForm(section, data);
      } catch (_) {
        body.innerHTML = '<p class="editor-loading" style="color:#f87171">Failed to load content.</p>';
      }
    }

    function renderEditorForm(section, data) {
      const fields = SECTION_FIELDS[section] || [];
      const body   = document.getElementById('editorBody');
      body.innerHTML = `
        <form class="editor-form" id="editorForm">
          <div class="editor-fields">
            ${fields.map(f => `
              <div class="editor-field ${f.type === 'textarea' ? 'editor-field--wide' : ''}">
                <label>${esc(f.label)}</label>
                ${f.type === 'textarea'
                  ? `<textarea name="${f.key}" rows="3">${esc(data[f.key] || '')}</textarea>`
                  : `<input type="text" name="${f.key}" value="${esc(data[f.key] || '')}" />`
                }
              </div>
            `).join('')}
          </div>
          <div class="editor-footer">
            <div class="editor-alert" id="editorAlert"></div>
            <button type="submit" class="btn btn-primary" id="editorSaveBtn">Save Changes</button>
          </div>
        </form>`;

      document.getElementById('editorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn   = document.getElementById('editorSaveBtn');
        const alert = document.getElementById('editorAlert');
        btn.disabled = true; btn.textContent = 'Saving…';
        alert.className = 'editor-alert'; alert.textContent = '';

        const payload = {};
        fields.forEach(f => {
          payload[f.key] = e.target[f.key].value;
        });

        try {
          const res = await fetch(`/api/content/${section}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            alert.className = 'editor-alert editor-alert--success';
            alert.textContent = '✓ Saved! Changes are live on your site.';
          } else {
            const d = await res.json();
            throw new Error(d.error || 'Save failed.');
          }
        } catch (err) {
          alert.className = 'editor-alert editor-alert--error';
          alert.textContent = '✗ ' + err.message;
        } finally {
          btn.disabled = false; btn.textContent = 'Save Changes';
        }
      });
    }

    // ════ SHARED ═════════════════════════════════════════════════════════════
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    });

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmt(s)  { return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
    function fmtDate(d) {
      return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    loadInquiries();
  </script>
</body>
</html>
