<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Cherry.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="auth-body">

  <div class="auth-bg">
    <div class="hero-orb orb-1"></div>
    <div class="hero-orb orb-2"></div>
  </div>

  <a href="/" class="auth-logo">cherry<span>.dev</span></a>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Set new password</h1>
      <p>Enter and confirm your new password below.</p>
    </div>

    <form id="resetForm" class="auth-form" novalidate>
      <div class="form-group">
        <label for="password">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Minimum 8 characters" autocomplete="new-password" required />
          <button type="button" class="toggle-pw" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repeat password" autocomplete="new-password" required />
      </div>
      <div class="form-alert" id="resetAlert" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-lg btn-full" id="resetBtn">Set Password</button>
    </form>

    <div class="auth-footer">
      <a href="/login" class="auth-back">← Back to login</a>
    </div>
  </div>

  <script>
    document.querySelector('.toggle-pw').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Read token from URL
    const token = new URLSearchParams(window.location.search).get('token');
    const alertEl = document.getElementById('resetAlert');

    if (!token) {
      alertEl.className   = 'form-alert form-alert--error';
      alertEl.textContent = 'Invalid or missing reset link. Please request a new one.';
      document.getElementById('resetBtn').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = document.getElementById('resetBtn');
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      alertEl.className   = 'form-alert';
      alertEl.textContent = '';

      if (password.length < 8) {
        alertEl.className   = 'form-alert form-alert--error';
        alertEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (password !== confirm) {
        alertEl.className   = 'form-alert form-alert--error';
        alertEl.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Saving…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alertEl.className   = 'form-alert form-alert--success';
          alertEl.textContent = '✓ Password updated! Redirecting to login…';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          throw new Error(data.error || 'Something went wrong.');
        }
      } catch (err) {
        alertEl.className   = 'form-alert form-alert--error';
        alertEl.textContent = '✗ ' + err.message;
        btn.disabled        = false;
        btn.textContent     = 'Set Password';
      }
    });
  </script>
</body>
</html>
