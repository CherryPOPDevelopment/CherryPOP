<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Verify Email - Aurelia Contacts</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .verify-container {
      background: white;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
    }

    .verify-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .verify-header h1 {
      color: #6366f1;
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }

    .verify-header p {
      color: #6b7280;
      margin: 0;
      font-size: 1rem;
    }

    .email-display {
      background: #f3f4f6;
      padding: 0.75rem;
      border-radius: 8px;
      text-align: center;
      margin: 1rem 0 2rem 0;
      font-weight: 600;
      color: #6366f1;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #374151;
      font-weight: 600;
    }

    .code-input {
      width: 100%;
      padding: 1rem;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-family: monospace;
      font-weight: bold;
    }

    .code-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .verify-btn {
      width: 100%;
      padding: 1rem;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .verify-btn:hover {
      background: #4f46e5;
    }

    .verify-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #ef4444;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border-left: 4px solid #10b981;
    }

    .alert-info {
      background: #dbeafe;
      color: #1e40af;
      border-left: 4px solid #3b82f6;
    }

    .resend-section {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #e5e7eb;
    }

    .resend-btn {
      background: none;
      border: none;
      color: #6366f1;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .resend-btn:hover {
      color: #4f46e5;
    }

    .resend-btn:disabled {
      color: #9ca3af;
      cursor: not-allowed;
    }

    .back-to-login {
      text-align: center;
      margin-top: 1rem;
    }

    .back-to-login a {
      color: #6366f1;
      text-decoration: none;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    /* Responsive Design - Comprehensive Mobile Support */
    
    /* Mobile and Tablets (max-width: 768px) */
    @media (max-width: 768px) {
      .verify-container {
        padding: 2.5rem;
        width: 95%;
      }

      .verify-header h1 {
        font-size: 1.75rem;
      }

      .verify-header p {
        font-size: 0.95rem;
      }

      .code-input {
        padding: 0.875rem;
        font-size: 1.75rem;
        letter-spacing: 0.75rem;
      }

      .verify-btn,
      .resend-btn {
        padding: 0.875rem;
        font-size: 0.95rem;
      }

      .icon {
        font-size: 3.5rem;
      }
    }

    /* Small Mobile (max-width: 480px) */
    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }

      .verify-container {
        padding: 2rem;
        width: 100%;
        border-radius: 12px;
      }

      .verify-header h1 {
        font-size: 1.5rem;
      }

      .verify-header p {
        font-size: 0.9rem;
      }

      .email-display {
        padding: 0.625rem;
        font-size: 0.9rem;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        font-size: 0.9rem;
      }

      .code-input {
        padding: 0.75rem;
        font-size: 1.5rem;
        letter-spacing: 0.5rem;
      }

      .verify-btn,
      .resend-btn {
        padding: 0.75rem;
        font-size: 0.9rem;
      }

      .icon {
        font-size: 3rem;
      }

      .alert {
        padding: 0.75rem;
        font-size: 0.875rem;
      }

      .back-link {
        font-size: 0.85rem;
      }
    }

    /* Extra Small Mobile (max-width: 375px) */
    @media (max-width: 375px) {
      .verify-container {
        padding: 1.5rem;
      }

      .verify-header h1 {
        font-size: 1.25rem;
      }

      .code-input {
        font-size: 1.25rem;
        letter-spacing: 0.4rem;
        padding: 0.625rem;
      }

      .icon {
        font-size: 2.5rem;
      }
    }

    /* Touch Device Optimization */
    @media (hover: none) and (pointer: coarse) {
      .verify-btn,
      .resend-btn,
      .back-link {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .code-input {
        font-size: 16px; /* Prevents zoom on iOS */
        letter-spacing: 0.3rem;
      }

      .verify-btn:active {
        transform: scale(0.95);
      }
    }

    /* High DPI Screens */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-header">
      <div class="icon">📧</div>
      <h1>Verify Your Email</h1>
      <p>Enter the 6-digit code sent to your email</p>
    </div>

    <div class="email-display" id="emailDisplay">
      Loading...
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="verifyForm">
      <div class="form-group">
        <label for="code">Verification Code</label>
        <input 
          type="text" 
          id="code" 
          class="code-input" 
          placeholder="000000"
          maxlength="6"
          pattern="[0-9]{6}"
          required
          autocomplete="off"
        >
      </div>

      <button type="submit" class="verify-btn" id="verifyBtn">
        Verify Email
      </button>
    </form>

    <div class="resend-section">
      <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 0.5rem;">
        Didn't receive the code?
      </p>
      <button class="resend-btn" id="resendBtn">
        Resend verification code
      </button>
    </div>

    <div class="back-to-login">
      <a href="/">← Back to Login</a>
    </div>
  </div>

  <script>
    // Use relative API URL for domain-based access only
    // Smart API URL detection
    let API_URL;
    const hostname = window.location.hostname;
    const protocol = window.location.protocol;
    
    if (hostname === 'localhost' || hostname === '127.0.0.1') {
      API_URL = `${protocol}//${hostname}:5000/api`;
    } else {
      API_URL = '/api';
    }
    
    console.log('Using API URL:', API_URL);
    
    // Get email from URL parameter or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const userEmail = urlParams.get('email') || localStorage.getItem('verificationEmail');

    // Display email
    if (userEmail) {
      document.getElementById('emailDisplay').textContent = userEmail;
      localStorage.setItem('verificationEmail', userEmail);
    } else {
      window.location.href = '/';
    }

    // Show alert function
    function showAlert(message, type = 'info') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;
    }

    // Hide alert function
    function hideAlert() {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert';
    }

    // Format code input (auto-space numbers)
    document.getElementById('code').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    // Verify form submission
    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const code = document.getElementById('code').value.trim();
      const verifyBtn = document.getElementById('verifyBtn');

      if (code.length !== 6) {
        showAlert('Please enter a valid 6-digit code', 'error');
        return;
      }

      // Disable button and show loading
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = 'Verifying<span class="loading"></span>';

      try {
        const response = await fetch(`${API_URL}/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, code })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('✅ ' + data.message, 'success');
          localStorage.removeItem('verificationEmail');
          
          // Redirect to login after 2 seconds
          setTimeout(() => {
            window.location.href = '/?verified=true';
          }, 2000);
        } else {
          showAlert(data.error || 'Verification failed', 'error');
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify Email';
        }
      } catch (error) {
        console.error('Verification error:', error);
        showAlert('Network error. Please try again.', 'error');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify Email';
      }
    });

    // Resend verification code
    document.getElementById('resendBtn').addEventListener('click', async () => {
      const resendBtn = document.getElementById('resendBtn');
      resendBtn.disabled = true;
      resendBtn.textContent = 'Sending...';
      hideAlert();

      try {
        const response = await fetch(`${API_URL}/auth/resend-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('✅ New verification code sent! Check your email.', 'success');
        } else {
          showAlert(data.error || 'Failed to resend code', 'error');
        }
      } catch (error) {
        console.error('Resend error:', error);
        showAlert('Network error. Please try again.', 'error');
      } finally {
        setTimeout(() => {
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend verification code';
        }, 30000); // 30 second cooldown
      }
    });
  </script>
</body>
</html>
