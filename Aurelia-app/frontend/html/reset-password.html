<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Reset Password - Aurelia</title>
    <link rel="icon" type="image/avif" href="../images/aureliaappicon.avif">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --bg-secondary: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .reset-container {
            background: var(--bg-secondary);
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .password-requirements {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .password-requirements p {
            color: #1e40af;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .password-requirements ul {
            margin-left: 1.25rem;
            color: #1e3a8a;
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .success-message {
            text-align: center;
        }

        .success-message h2 {
            color: var(--success);
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }

        .success-message p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        /* Responsive Design - Comprehensive Mobile Support */
        
        /* Mobile and Tablets (max-width: 768px) */
        @media (max-width: 768px) {
            body {
                padding: 0.75rem;
            }

            .reset-container {
                padding: 2rem;
            }

            .logo h1 {
                font-size: 1.75rem;
            }

            .logo p {
                font-size: 0.9rem;
            }

            .form-group input {
                padding: 0.625rem;
                font-size: 0.95rem;
            }

            .btn-primary {
                padding: 0.625rem 1.25rem;
                font-size: 0.95rem;
            }

            .password-requirements {
                padding: 0.875rem;
                font-size: 0.8rem;
            }
        }

        /* Small Mobile (max-width: 480px) */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .reset-container {
                padding: 1.5rem;
                border-radius: 0.75rem;
            }

            .logo h1 {
                font-size: 1.5rem;
            }

            .logo p {
                font-size: 0.85rem;
            }

            .form-group {
                margin-bottom: 1.25rem;
            }

            .form-group label {
                font-size: 0.9rem;
            }

            .form-group input {
                padding: 0.5rem;
                font-size: 0.9rem;
            }

            .btn-primary {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }

            .password-requirements {
                padding: 0.75rem;
                font-size: 0.75rem;
            }

            .password-requirements h4 {
                font-size: 0.9rem;
            }

            .alert {
                padding: 0.75rem;
                font-size: 0.875rem;
            }

            .success-icon {
                width: 70px;
                height: 70px;
            }

            .success-message h2 {
                font-size: 1.5rem;
            }

            .success-message p {
                font-size: 0.9rem;
            }
        }

        /* Extra Small Mobile (max-width: 375px) */
        @media (max-width: 375px) {
            .reset-container {
                padding: 1.25rem;
            }

            .logo h1 {
                font-size: 1.25rem;
            }

            .success-message h2 {
                font-size: 1.25rem;
            }
        }

        /* Touch Device Optimization */
        @media (hover: none) and (pointer: coarse) {
            .btn-primary,
            .link-button {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .form-group input {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .btn-primary:active {
                transform: scale(0.95);
            }
        }

        /* High DPI Screens */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            body {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <h1>🪼 Aurelia Contacts</h1>
            <p>Reset Your Password</p>
        </div>

        <div id="message-area"></div>

        <!-- Reset Password Form -->
        <div id="reset-form-view">
            <div class="password-requirements">
                <p>Password Requirements:</p>
                <ul>
                    <li>At least 8 characters long</li>
                    <li>Can include letters, numbers, and special characters</li>
                </ul>
            </div>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required autocomplete="new-password"
                        placeholder="Enter your new password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required autocomplete="new-password"
                        placeholder="Confirm your new password">
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Reset Password
                </button>
            </form>
        </div>

        <!-- Success View -->
        <div id="success-view" class="hidden">
            <div class="success-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="success-message">
                <h2>Password Reset Successfully!</h2>
                <p>Your password has been updated. You can now log in with your new password.</p>
                <a href="/" class="btn btn-primary">Go to Login</a>
            </div>
        </div>

        <div class="back-link">
            <a href="/">← Back to Login</a>
        </div>
    </div>

    <script>
        // Smart API URL detection
        let API_URL;
        const hostname = window.location.hostname;
        const protocol = window.location.protocol;
        
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
            API_URL = `${protocol}//${hostname}:5000/api`;
        } else {
            API_URL = '/api';
        }
        
        console.log('Using API URL:', API_URL);
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showMessage('Invalid or missing reset token. Please request a new password reset.', 'error');
            document.getElementById('reset-form-view').classList.add('hidden');
        }

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitBtn = document.getElementById('submit-btn');

            // Validate password is not empty
            if (!newPassword || newPassword.length === 0) {
                showMessage('Password cannot be empty.', 'error');
                return;
            }

            // Validate password length - accept ANY password 8+ characters (letters, numbers, special chars)
            if (newPassword.length < 8) {
                showMessage('Password must be at least 8 characters long.', 'error');
                return;
            }

            // Validate passwords match exactly
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match. Please try again.', 'error');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Resetting Password...';

            try {
                console.log('Sending reset password request to:', `${API_URL}/auth/reset-password`);
                console.log('Token:', token);
                console.log('Password length:', newPassword.length);
                
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                console.log('Response status:', response.status);
                
                // Handle rate limiting (429) specially
                if (response.status === 429) {
                    const text = await response.text();
                    console.error('Rate limit hit:', text);
                    showMessage('Too many password reset attempts. Please wait an hour and try again, or contact support.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                    return;
                }
                
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    console.error('Failed to parse response as JSON:', e);
                    const text = await response.text();
                    showMessage('Server error: ' + text, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                    return;
                }
                
                console.log('Response data:', data);

                if (response.ok) {
                    // Show success view
                    document.getElementById('reset-form-view').classList.add('hidden');
                    document.getElementById('success-view').classList.remove('hidden');
                    document.getElementById('message-area').innerHTML = '';
                } else {
                    const errorMsg = data.error || 'Failed to reset password. The link may have expired.';
                    console.error('Error from server:', errorMsg);
                    showMessage(errorMsg, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Reset password error:', error);
                const errorMsg = error.message || 'Failed to reset password. Please check your connection and try again.';
                showMessage(errorMsg, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });

        function showMessage(message, type) {
            const messageArea = document.getElementById('message-area');
            const alertClass = type === 'error' ? 'alert-error' : 'alert-success';
            messageArea.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }
    </script>
</body>
</html>
